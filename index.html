<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Career Notebook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">YS</div>
        <div><strong>Career Notebook</strong><span>박연수의 취업 준비 노트</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <small>브라우저에서 수정한 내용은 이 기기에만 저장돼요. 주기적으로 내보내서 data.js에 반영하세요.</small>
        <button class="btn ghost sm block" id="exportBtn">data.js 내보내기</button>
        <button class="btn ghost sm block" id="importBtn">가져오기</button>
        <button class="btn danger sm block" id="resetBtn">브라우저 수정 초기화</button>
        <input type="file" id="importFile" accept=".js,.json" hidden>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="메뉴">☰</button>
        <span id="topTitle"></span>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" data-action="modal-close" aria-label="닫기">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
